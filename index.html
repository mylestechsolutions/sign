<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MylesTech Sign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Dancing+Script:wght@600&display=swap">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="stylesheet" href="assets/app.css?v=15">
</head>
<body>
  <header class="top"><div class="brand"><img src="assets/logo.png" alt="MylesTech" class="logo"><div>MylesTech <span>Sign</span></div></div><div id="lang"></div></header>
  <main class="stack">
    <section id="signin" class="signin hidden"></section>
    <section id="home" class="stack hidden"></section>
    <section id="compose" class="stack hidden"></section>
    <section id="managers" class="stack hidden"></section>
  </main>
  <dialog id="viewer"><button class="x" aria-label="Close">&times;</button><div class="pages" id="viewer-pages"></div></dialog>
  <dialog id="history"><button class="x" aria-label="Close">&times;</button><h2 id="history-title"></h2><ul class="feed" id="history-list"></ul></dialog>
  <script src="assets/config.js?v=15"></script>
  <script src="assets/core.js?v=15"></script>
  <script src="assets/i18n.js?v=15"></script>
  <script src="assets/api.js?v=15"></script>
  <script src="assets/pad.js?v=15"></script>
  <script type="module" src="assets/console.js?v=15"></script>
</body>
</html>
